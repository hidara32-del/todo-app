---
- name: Configuration de l'environnement DevOps
  hosts: local
  become: yes

  tasks:

    - name: Mettre à jour les paquets
      apt:
        update_cache: yes

    - name: Installer Git
      apt:
        name: git
        state: present

    - name: Installer Docker
      apt:
        name: docker.io
        state: present

    - name: Démarrer Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Installer Java
      apt:
        name: openjdk-21-jdk
        state: present

    - name: Installer Maven
      apt:
        name: maven
        state: present

    - name: Vérifier Git
      command: git --version
      register: git_version

    - debug:
        var: git_version.stdout

    - name: Vérifier Docker
      command: docker --version
      register: docker_version

    - debug:
        var: docker_version.stdout

    - name: Vérifier Java
      command: java -version
      register: java_version
      ignore_errors: yes

    - debug:
        var: java_version.stderr

    - name: Vérifier Maven
      command: mvn -version
      register: maven_version

    - debug:
        var: maven_version.stdout